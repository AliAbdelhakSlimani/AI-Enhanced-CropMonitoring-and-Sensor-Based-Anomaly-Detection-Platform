services:
  db:
    image: postgres:15
    container_name: crop_db
    environment:
      POSTGRES_DB: cropdb
      POSTGRES_USER: cropuser
      POSTGRES_PASSWORD: croppass123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cropuser -d cropdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: crop_backend
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_DB=cropdb
      - POSTGRES_USER=cropuser
      - POSTGRES_PASSWORD=croppass123
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - SECRET_KEY=super_secret_key_change_me_123456789
      - DEBUG=1
      - DJANGO_SUPERUSER_USERNAME=admin
      - DJANGO_SUPERUSER_PASSWORD=admin123
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: