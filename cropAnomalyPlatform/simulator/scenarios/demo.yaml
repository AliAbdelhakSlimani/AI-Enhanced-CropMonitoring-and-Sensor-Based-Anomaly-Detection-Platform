# simulator/scenarios/demo.yaml – SCÉNARIO RÉALISTE D'UNE JOURNÉE DANS UNE FERME
# Objectif : 5 anomalies logiques sur 2 parcelles différentes
# Dates : aujourd'hui et demain (change selon ta date actuelle)
# Heures : progressives de la nuit au soir (cohérent)

plots:
  # Plot 1 : Parcelle "Champ Nord" – culture sensible à l'eau
  1:
    events:
      # 03:15 – Fuite nocturne (typique : pompe qui s'arrête)
      - time: "03:15"
        type: "irrigation_leak"
        description: "Fuite de pompe nocturne – humidité sol chute à 10-32%"
      
      # 14:30 – Canicule d'après-midi (typique en été)
      - time: "12:14"
        type: "heat_stress"
        description: "Température >33°C + air très sec – stress thermique"
      
      # 16:45 – Excès d'humidité après arrosage excessif
      - time: "23:34"
        type: "excess_moisture"
        description: "Arrosage trop fort – sol saturé 86-98%"

  # Plot 2 : Parcelle "Champ Sud" – culture plus résistante
  2:
    events:
      # 05:30 – Gel matinal (typique au printemps)
      - time: "05:30"
        type: "cold_stress"
        description: "Température <10°C + air humide – risque gel"
      
      # 13:15 – Sécheresse progressive (manque d'eau sur plusieurs heures)
      - time: "13:15"
        type: "dry_stress"
        description: "Humidité sol 25-44% – sécheresse modérée"